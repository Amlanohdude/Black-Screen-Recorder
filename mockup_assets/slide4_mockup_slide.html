<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: linear-gradient(180deg, #181416 0%, #0c0a0c 55%, #070708 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* AMBIENT RED GLOW BEHIND PHONE */
    .ambient-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      top: 550px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(229, 9, 20, 0.28) 0%, rgba(229, 9, 20, 0.08) 55%, transparent 75%);
      z-index: 1;
      pointer-events: none;
    }

    /* TOP TEXT SECTION */
    .header-section {
      width: 100%;
      text-align: center;
      padding-top: 130px;
      z-index: 10;
    }

    .tag-badge {
      display: inline-block;
      color: #e50914;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .main-headline {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 20px;
    }
    .highlight-red {
      color: #e50914;
    }

    .sub-headline {
      font-size: 28px;
      font-weight: 500;
      color: #9a9aa8;
      max-width: 820px;
      margin: 0 auto;
      line-height: 1.4;
    }

    /* PHONE FRAME */
    .phone-wrapper {
      position: absolute;
      top: 450px;
      left: 50%;
      transform: translateX(-50%);
      width: 760px;
      height: 1540px;
      background: #1e1e24;
      border-radius: 68px;
      padding: 16px;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(255, 255, 255, 0.08);
      z-index: 5;
    }

    .phone-inner-screen {
      width: 100%;
      height: 100%;
      border-radius: 52px;
      overflow: hidden;
      position: relative;
      background: #0d0d12;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* CAMERA PUNCH HOLE */
    .punch-hole {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: #000;
      border-radius: 50%;
      border: 1.5px solid #222;
      z-index: 30;
    }

    /* EMBEDDED IFRAME CONTENT */
    iframe {
      width: 1080px;
      height: 1920px;
      transform-origin: top left;
      transform: scale(0.674);
      border: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="header-section">
    <div class="tag-badge">VAULT</div>
    <div class="main-headline">Keep your clips <span class="highlight-red">private</span></div>
    <div class="sub-headline">Protect your personal recordings behind Fingerprint & PIN lock</div>
  </div>

  <div class="phone-wrapper">
    <div class="phone-inner-screen">
      <div class="punch-hole"></div>
      <iframe src="slide4_raw_screen.html"></iframe>
    </div>
  </div>
</body>
</html>
